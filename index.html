<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostHog TIL — Today I Learned Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #F3F0E6;
      --bg-card: #FFFFFF;
      --bg-muted: #E5E1D5;
      --border-ink: #151515;
      --text-primary: #151515;
      --text-secondary: #4B4B45;
      --ph-orange: #F54E00;
      --ph-orange-hover: #D94500;
      --ph-yellow: #F7A501;
      --ph-blue: #1D4AFF;
      --ph-green: #2F9E44;
      --ph-purple: #7048E8;
      --radius-md: 8px;
      --radius-sm: 5px;
      --shadow-hard: 4px 4px 0px #151515;
      --shadow-hard-sm: 2px 2px 0px #151515;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#C8C3B4 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-primary);
      line-height: 1.5;
      padding: 24px 16px 80px;
    }

    code, .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: var(--ph-yellow);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-hard);
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand p {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .version-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--border-ink);
      color: #FFFFFF;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .identity-box {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-hard-sm);
      padding: 3px 8px;
      gap: 6px;
    }

    .identity-box input {
      border: none;
      outline: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      width: 100px;
      background: transparent;
      color: var(--text-primary);
    }

    /* Buttons */
    button {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      border: 2px solid var(--border-ink);
      box-shadow: var(--shadow-hard-sm);
      background: var(--bg-card);
      color: var(--text-primary);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
    }

    button:hover {
      background: var(--bg-muted);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border-ink);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-ink);
    }

    .btn-primary {
      background: var(--ph-orange);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--ph-orange-hover);
    }

    .btn-secondary {
      background: #FFFFFF;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 0.78rem;
      box-shadow: 1px 1px 0px var(--border-ink);
    }

    /* Hedgehog Shortcut Button */
    #hedgehog-runner {
      display: inline-flex;
      align-items: center;
      position: relative;
      z-index: 999;
      transition: left 0.2s ease-out, top 0.2s ease-out;
    }

    #hedgehog-runner.running {
      position: fixed;
    }

    #hedgehog-runner button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #FFFFFF;
    }

    #hedgehog-runner.tired button {
      background: #E0E7FF;
      border-style: dashed;
    }

    .hedgehog-sprite {
      display: inline-flex;
      align-items: center;
      position: relative;
    }

    .sleep-badge {
      display: none;
      position: absolute;
      top: -11px;
      right: -7px;
      font-size: 0.8rem;
    }

    #hedgehog-runner.tired .sleep-badge {
      display: inline;
    }

    .dodge-counter {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      background: var(--bg-muted);
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--border-ink);
    }

    /* Toast Banner */
    #toast-banner {
      display: none;
      background: var(--border-ink);
      color: #FFFFFF;
      border: 2px solid var(--border-ink);
      box-shadow: var(--shadow-hard);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    #toast-banner.visible {
      display: flex;
    }

    /* Focus Mode Notice */
    #focus-banner {
      display: none;
      background: var(--ph-blue);
      border: 2px solid var(--border-ink);
      box-shadow: var(--shadow-hard);
      color: #FFFFFF;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    #focus-banner code {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }

    body.focus-mode-active #focus-banner {
      display: block;
    }

    body.focus-mode-active #stats-bar,
    body.focus-mode-active #feed-section {
      display: none;
    }

    /* Cards & Form */
    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-hard);
    }

    .card-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-ink);
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .accent-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--ph-orange);
      border: 2px solid var(--border-ink);
      display: inline-block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 9px 11px;
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-sm);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      background: #FAF9F5;
      color: var(--text-primary);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      background: #FFFFFF;
      box-shadow: 3px 3px 0px var(--ph-yellow);
    }

    textarea {
      resize: vertical;
      min-height: 62px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
    }

    /* Stats Row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-hard);
      padding: 14px 16px;
    }

    .stat-box:nth-child(1) { border-top: 6px solid var(--ph-orange); }
    .stat-box:nth-child(2) { border-top: 6px solid var(--ph-yellow); }
    .stat-box:nth-child(3) { border-top: 6px solid var(--ph-blue); }

    .stat-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Filter Pills */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }

    .pill {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid var(--border-ink);
      box-shadow: 2px 2px 0px var(--border-ink);
      background: var(--bg-card);
      cursor: pointer;
    }

    .pill.active {
      background: var(--ph-orange);
      color: #FFFFFF;
    }

    /* Entry List */
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-state {
      background: var(--bg-card);
      border: 2px dashed var(--border-ink);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state strong {
      display: block;
      color: var(--text-primary);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .entry-card {
      background: var(--bg-card);
      border: 2px solid var(--border-ink);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-hard);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entry-card.pending {
      border-left: 8px solid var(--ph-yellow);
    }

    .entry-card.completed {
      border-left: 8px solid var(--ph-green);
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .entry-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.73rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-canvas);
      border: 1.5px solid var(--border-ink);
      white-space: nowrap;
    }

    .badge.topic-badge {
      background: #FFF3BF;
    }

    .badge.status-pending {
      background: var(--ph-yellow);
      color: var(--border-ink);
      font-weight: 700;
    }

    .badge.status-completed {
      background: #D3F9D8;
      color: #14532D;
      font-weight: 700;
    }

    .entry-note {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.78rem;
      margin-top: 4px;
    }

    .entry-meta a {
      color: var(--ph-blue);
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
    }

    .entry-meta a:hover {
      text-decoration: underline;
    }

    /* Inline Complete Drawer */
    .complete-drawer {
      display: none;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 2px dashed var(--border-ink);
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .complete-drawer.open {
      display: flex;
    }

    @media (max-width: 600px) {
      .form-grid, .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <h1>PostHog TIL <span class="version-tag">v1.1</span></h1>
        <p>Track what you learn — instrumented with PostHog</p>
      </div>

      <div class="header-actions">
        <!-- User Identification -->
        <div class="identity-box" title="Calls posthog.identify()">
          <span class="mono" style="font-size: 0.75rem; font-weight: 700;">user:</span>
          <input type="text" id="learner-id-input" placeholder="user id" aria-label="Learner ID" />
          <button type="button" class="btn-sm" id="identify-btn">Set</button>
        </div>

        <!-- Survey Trigger -->
        <button type="button" id="share-feedback-btn">Share Feedback</button>

        <!-- Hedgehog Shortcut Button (10 dodges -> sleeps -> resets after 10s) -->
        <div id="hedgehog-runner">
          <button type="button" id="shortcut-btn">
            <span class="hedgehog-sprite" aria-hidden="true">
              <svg width="24" height="18" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 17C3 14 4 9 8 7L10 4L13 6L16 3L19 6L22 4L24 8C27 10 28 14 27 17H5Z" fill="#78350F" stroke="#151515" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M21 17C21 12 24 10 28 12C30 13 31 15 31 17H21Z" fill="#FDE68A" stroke="#151515" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="30.5" cy="15.5" r="1.4" fill="#151515"/>
                <circle cx="25.5" cy="14" r="1.1" fill="#151515"/>
                <line x1="10" y1="17" x2="10" y2="21" stroke="#151515" stroke-width="2" stroke-linecap="round"/>
                <line x1="22" y1="17" x2="22" y2="21" stroke="#151515" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span class="sleep-badge">💤</span>
            </span>
            <span>Shortcut to Learning</span>
            <span class="dodge-counter" id="dodge-counter" title="Dodges before nap">0/10</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Toast Notification -->
    <div id="toast-banner" role="status">
      <span id="toast-message"></span>
      <button type="button" class="btn-sm" onclick="hideToast()">Dismiss</button>
    </div>

    <!-- Feature Flag Banner (focus-mode) -->
    <div id="focus-banner">
      <strong>Focus Mode Active</strong> (via PostHog Feature Flag <code>focus-mode</code>) — Feed and stats are hidden so you can log distraction-free.
    </div>

    <!-- Quick-Log / Queue Form -->
    <section class="card" aria-label="Log a learning">
      <div class="card-header-bar">
        <h2><span class="accent-dot"></span> Capture a Learning</h2>
        <span class="mono" style="font-size: 0.74rem; color: var(--text-secondary);">localStorage + PostHog</span>
      </div>

      <form id="til-form">
        <div class="form-grid">
          <div class="full-width">
            <label for="title-input">What did you learn (or want to study)? *</label>
            <input type="text" id="title-input" maxlength="120" required placeholder="e.g., How SQL window functions rank rows without collapsing them" />
          </div>

          <div>
            <label for="topic-input">Topic Tag (free text) *</label>
            <input type="text" id="topic-input" list="topic-suggestions" maxlength="24" required placeholder="e.g., posthog, sql, ai, code" />
            <datalist id="topic-suggestions">
              <option value="posthog"></option>
              <option value="sql"></option>
              <option value="ai"></option>
              <option value="code"></option>
              <option value="analytics"></option>
            </datalist>
          </div>

          <div>
            <label for="source-select">Source *</label>
            <select id="source-select">
              <option value="docs">docs</option>
              <option value="code">code / repo</option>
              <option value="hands_on">hands_on</option>
              <option value="video">video</option>
              <option value="article">article</option>
            </select>
          </div>

          <div>
            <label for="difficulty-select">Difficulty (1–5, for completed)</label>
            <select id="difficulty-select">
              <option value="1">1 — Easy</option>
              <option value="2">2 — Smooth</option>
              <option value="3" selected>3 — Moderate</option>
              <option value="4">4 — Deep Dive</option>
              <option value="5">5 — Brain Melter</option>
            </select>
          </div>

          <div>
            <label for="mood-select">Mood</label>
            <select id="mood-select">
              <option value="curious">curious</option>
              <option value="energized">energized</option>
              <option value="tired">tired</option>
            </select>
          </div>

          <div class="full-width">
            <label for="url-input">Reference Link (optional)</label>
            <input type="url" id="url-input" placeholder="https://..." />
          </div>

          <div class="full-width">
            <label for="note-input">Key Takeaway Note (optional)</label>
            <textarea id="note-input" placeholder="Short note on what clicked..."></textarea>
          </div>

          <div class="full-width">
            <label for="private-input">Private Reflection (masked in Session Replay via <code>ph-no-capture</code>)</label>
            <input type="text" id="private-input" class="ph-no-capture" placeholder="Never sent to PostHog events & masked in replays" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" data-action="log">Log Now ✓</button>
          <button type="button" class="btn-secondary" id="save-queue-btn">Save to Queue (Pending)</button>
        </div>
      </form>
    </section>

    <!-- Summary Stats -->
    <section id="stats-bar" class="stats-grid" aria-label="Learning statistics">
      <div class="stat-box">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Learnings Completed</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">In Study Queue</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="stat-difficulty">0.0</div>
        <div class="stat-label">Avg Difficulty (1–5)</div>
      </div>
    </section>

    <!-- Feed & Dynamic Topic Filters -->
    <section id="feed-section" aria-label="Learning feed">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="entry-list" id="entry-list"></div>
    </section>
  </div>

  <!-- PostHog Snippet + App Logic -->
  <script>
    // =========================================================================
    // 1. POSTHOG CONFIGURATION (Injected at runtime via Netlify Snippet Injection)
    // =========================================================================
    const POSTHOG_PROJECT_KEY = window.ENV_POSTHOG_KEY || 'YOUR_POSTHOG_PROJECT_API_KEY';
    const POSTHOG_API_HOST = window.ENV_POSTHOG_HOST || 'https://us.i.posthog.com';

    !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once unregister opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug getFeatureFlag isFeatureEnabled onFeatureFlags reloadFeatureFlags identify setPersonProperties reset".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);

    if (POSTHOG_PROJECT_KEY && POSTHOG_PROJECT_KEY !== 'YOUR_POSTHOG_PROJECT_API_KEY') {
      posthog.init(POSTHOG_PROJECT_KEY, {
        api_host: POSTHOG_API_HOST,
        person_profiles: 'identified_only',
        autocapture: true,
        capture_pageview: true
      });
    }

    function safeCapture(eventName, props = {}) {
      if (window.posthog && typeof posthog.capture === 'function') {
        posthog.capture(eventName, props);
      }
      console.log('[PostHog Event]', eventName, props);
    }

    // =========================================================================
    // 2. DATA STORE (STARTS EMPTY — NO HARDCODED ENTRIES)
    // =========================================================================
    const STORAGE_KEY = 'posthog_til_entries_v2';
    let currentFilter = 'all';

    function loadEntries() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    let entries = loadEntries();

    // =========================================================================
    // 3. UI RENDERING & DYNAMIC TOPIC FILTERS
    // =========================================================================
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-message').textContent = msg;
      banner.classList.add('visible');
    }

    function hideToast() {
      document.getElementById('toast-banner').classList.remove('visible');
    }

    function normalizeTopic(rawTopic) {
      const cleaned = (rawTopic || '').trim().toLowerCase().replace(/^#+/, '');
      return cleaned || 'general';
    }

    function renderFilterPills() {
      const filterBar = document.getElementById('filter-bar');
      const uniqueTopics = Array.from(new Set(entries.map(e => normalizeTopic(e.topic))));

      if (currentFilter !== 'all' && !uniqueTopics.includes(currentFilter)) {
        currentFilter = 'all';
      }

      if (uniqueTopics.length === 0) {
        filterBar.innerHTML = '';
        return;
      }

      const pillsHtml = ['all', ...uniqueTopics].map(topic => {
        const isActive = currentFilter === topic ? 'active' : '';
        return `<button type="button" class="pill ${isActive}" data-topic="${escapeHtml(topic)}">${escapeHtml(topic)}</button>`;
      }).join('');

      filterBar.innerHTML = `<span class="mono" style="font-size: 0.78rem; font-weight: 700;">Filter:</span>${pillsHtml}`;
    }

    function render() {
      const completed = entries.filter(e => e.status === 'completed');
      const pending = entries.filter(e => e.status === 'pending');

      document.getElementById('stat-completed').textContent = completed.length;
      document.getElementById('stat-pending').textContent = pending.length;

      const avgDiff = completed.length
        ? (completed.reduce((sum, e) => sum + (Number(e.difficulty) || 0), 0) / completed.length).toFixed(1)
        : '0.0';
      document.getElementById('stat-difficulty').textContent = avgDiff;

      renderFilterPills();

      const filtered = currentFilter === 'all'
        ? entries
        : entries.filter(e => normalizeTopic(e.topic) === currentFilter);

      const listEl = document.getElementById('entry-list');
      listEl.innerHTML = '';

      if (entries.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <strong>Nothing logged yet</strong>
            <span>Add your first takeaway above — like a SQL window function, a PostHog feature, or a code trick.</span>
          </div>
        `;
        return;
      }

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><strong>No entries for this topic</strong></div>';
        return;
      }

      filtered.forEach(entry => {
        const card = document.createElement('article');
        card.className = `entry-card ${entry.status}`;

        const isPending = entry.status === 'pending';
        const statusBadge = isPending
          ? '<span class="badge status-pending">Pending</span>'
          : '<span class="badge status-completed">Logged ✓</span>';

        const linkHtml = entry.reference_url
          ? `<a href="${escapeHtml(entry.reference_url)}" target="_blank" rel="noopener noreferrer">↗ Reference</a>`
          : '';

        const completedMeta = !isPending
          ? `<span class="badge">difficulty: ${entry.difficulty}/5</span>
             <span class="badge">mood: ${escapeHtml(entry.mood)}</span>`
          : `<button type="button" class="btn-sm btn-primary" onclick="toggleCompleteDrawer('${entry.id}')">Mark Learned ✓</button>`;

        card.innerHTML = `
          <div class="entry-header">
            <div class="entry-title">${escapeHtml(entry.title)}</div>
            ${statusBadge}
          </div>
          ${entry.note ? `<div class="entry-note">${escapeHtml(entry.note)}</div>` : ''}
          <div class="entry-meta">
            <span class="badge topic-badge">#${escapeHtml(normalizeTopic(entry.topic))}</span>
            <span class="badge">source: ${escapeHtml(entry.source)}</span>
            ${linkHtml}
            ${completedMeta}
          </div>
          ${isPending ? `
            <div class="complete-drawer" id="drawer-${entry.id}">
              <div>
                <label>Difficulty (1–5)</label>
                <select id="diff-${entry.id}">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div>
                <label>Mood</label>
                <select id="mood-${entry.id}">
                  <option value="curious">curious</option>
                  <option value="energized">energized</option>
                  <option value="tired">tired</option>
                </select>
              </div>
              <div style="flex: 1; min-width: 180px;">
                <label>Takeaway Note</label>
                <input type="text" id="note-${entry.id}" placeholder="Quick takeaway..." />
              </div>
              <button type="button" class="btn-sm btn-primary" onclick="completeQueuedEntry('${entry.id}')">Confirm</button>
            </div>
          ` : ''}
        `;
        listEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    window.toggleCompleteDrawer = function(id) {
      const drawer = document.getElementById(`drawer-${id}`);
      if (drawer) drawer.classList.toggle('open');
    };

    window.completeQueuedEntry = function(id) {
      const idx = entries.findIndex(e => e.id === id);
      if (idx === -1) return;

      const difficulty = Number(document.getElementById(`diff-${id}`).value);
      const mood = document.getElementById(`mood-${id}`).value;
      const note = document.getElementById(`note-${id}`).value.trim();

      entries[idx] = {
        ...entries[idx],
        status: 'completed',
        difficulty,
        mood,
        note: note || entries[idx].note,
        from_queue: true
      };

      saveEntries(entries);
      render();

      safeCapture('learning_logged', {
        topic: normalizeTopic(entries[idx].topic),
        source: entries[idx].source,
        difficulty,
        mood,
        from_queue: true,
        has_note: Boolean(entries[idx].note),
        has_link: Boolean(entries[idx].reference_url)
      });

      showToast(`Completed "${entries[idx].title}" and sent learning_logged to PostHog!`);
    };

    // =========================================================================
    // 4. FORM SUBMISSION (LOG NOW vs. SAVE TO QUEUE)
    // =========================================================================
    function handleCreateEntry(mode) {
      const titleEl = document.getElementById('title-input');
      const topicEl = document.getElementById('topic-input');
      const title = titleEl.value.trim();
      const rawTopic = topicEl.value.trim();

      if (!title) {
        titleEl.focus();
        return;
      }
      if (!rawTopic) {
        topicEl.focus();
        return;
      }

      const topic = normalizeTopic(rawTopic);
      const source = document.getElementById('source-select').value;
      const difficulty = Number(document.getElementById('difficulty-select').value);
      const mood = document.getElementById('mood-select').value;
      const reference_url = document.getElementById('url-input').value.trim();
      const note = document.getElementById('note-input').value.trim();

      const isCompleted = mode === 'log';

      const newEntry = {
        id: 'til-' + Date.now(),
        title,
        note,
        reference_url,
        topic,
        source,
        status: isCompleted ? 'completed' : 'pending',
        difficulty: isCompleted ? difficulty : null,
        mood: isCompleted ? mood : null,
        from_queue: false,
        created_at: new Date().toISOString()
      };

      entries.unshift(newEntry);
      saveEntries(entries);
      render();

      if (isCompleted) {
        safeCapture('learning_logged', {
          topic,
          source,
          difficulty,
          mood,
          from_queue: false,
          has_note: Boolean(note),
          has_link: Boolean(reference_url)
        });
        showToast('Learning logged and captured in PostHog!');
      } else {
        safeCapture('learning_created', {
          topic,
          source,
          has_link: Boolean(reference_url)
        });
        showToast('Saved to your study queue (learning_created fired).');
      }

      document.getElementById('til-form').reset();
    }

    document.getElementById('til-form').addEventListener('submit', (e) => {
      e.preventDefault();
      handleCreateEntry('log');
    });

    document.getElementById('save-queue-btn').addEventListener('click', () => {
      handleCreateEntry('queue');
    });

    // =========================================================================
    // 5. FILTERS, IDENTIFY & FEEDBACK SURVEY TRIGGER
    // =========================================================================
    document.getElementById('filter-bar').addEventListener('click', (e) => {
      if (!e.target.classList.contains('pill')) return;
      currentFilter = e.target.dataset.topic;
      render();
      safeCapture('filter_applied', { selected_topic: currentFilter });
    });

    const IDENTIFIED_USER_KEY = 'posthog_til_identified_user';

    function identifyLearner() {
      const inputEl = document.getElementById('learner-id-input');
      const userId = inputEl.value.trim();
      if (!userId) {
        inputEl.focus();
        return;
      }

      if (window.posthog && typeof posthog.identify === 'function') {
        const previousUser = localStorage.getItem(IDENTIFIED_USER_KEY);
        const currentDistinctId = typeof posthog.get_distinct_id === 'function'
          ? posthog.get_distinct_id()
          : null;
        const alreadyIdentified = (typeof posthog._isIdentified === 'function' && posthog._isIdentified())
          || Boolean(previousUser);

        if (alreadyIdentified && (previousUser ? previousUser !== userId : currentDistinctId !== userId)) {
          if (typeof posthog.reset === 'function') {
            posthog.reset();
          }
        }

        posthog.identify(userId, { role: 'tse_candidate', name: userId });
      }

      localStorage.setItem(IDENTIFIED_USER_KEY, userId);
      showToast(`Identified user as "${userId}" in PostHog.`);
    }

    document.getElementById('identify-btn').addEventListener('click', identifyLearner);
    document.getElementById('learner-id-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        identifyLearner();
      }
    });

    document.getElementById('share-feedback-btn').addEventListener('click', () => {
      safeCapture('feedback_opened', { source: 'header_button' });
    });

    // =========================================================================
    // 6. HEDGEHOG "SHORTCUT TO LEARNING" (10 DODGES -> SLEEPS -> RESETS AFTER 10S)
    // =========================================================================
    const runner = document.getElementById('hedgehog-runner');
    const shortcutBtn = document.getElementById('shortcut-btn');
    const dodgeCounterEl = document.getElementById('dodge-counter');
    const MAX_DODGES = 10;
    const SLEEP_RESET_MS = 10000;

    let dodgeCount = 0;
    let isTired = false;
    let resetTimer = null;

    function updateDodgeCounter() {
      dodgeCounterEl.textContent = `${dodgeCount}/${MAX_DODGES}`;
    }

    function resetHedgehog() {
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      dodgeCount = 0;
      isTired = false;
      runner.classList.remove('running', 'tired');
      runner.style.left = '';
      runner.style.top = '';
      updateDodgeCounter();
    }

    function dodgeCursor() {
      if (isTired) return;

      if (dodgeCount === 0) {
        safeCapture('shortcut_button_chased', { max_dodges: MAX_DODGES });
      }

      dodgeCount += 1;
      updateDodgeCounter();

      runner.classList.add('running');
      const padding = 24;
      const maxX = Math.max(padding, window.innerWidth - runner.offsetWidth - padding);
      const maxY = Math.max(padding, window.innerHeight - runner.offsetHeight - padding);

      const nextX = Math.floor(Math.random() * maxX);
      const nextY = Math.floor(Math.random() * maxY);

      runner.style.left = `${nextX}px`;
      runner.style.top = `${nextY}px`;

      if (dodgeCount >= MAX_DODGES) {
        isTired = true;
        runner.classList.add('tired');
        resetTimer = setTimeout(() => {
          resetHedgehog();
        }, SLEEP_RESET_MS);
      }
    }

    runner.addEventListener('mouseenter', dodgeCursor);

    shortcutBtn.addEventListener('click', () => {
      if (!isTired) {
        dodgeCursor();
        return;
      }
      safeCapture('shortcut_button_caught', { dodges_taken: dodgeCount });
      showToast("🦔 You could've learned something else by now.");
      resetHedgehog();
    });

    // =========================================================================
    // 7. FEATURE FLAG EVALUATION & INITIAL PAGE EVENT
    // =========================================================================
    function applyFocusMode(enabled) {
      document.body.classList.toggle('focus-mode-active', Boolean(enabled));
    }

    if (window.posthog && typeof posthog.onFeatureFlags === 'function') {
      posthog.onFeatureFlags(() => {
        const focusEnabled = posthog.isFeatureEnabled('focus-mode');
        applyFocusMode(focusEnabled);
        safeCapture('app_opened', {
          theme_mode: focusEnabled ? 'focus' : 'standard'
        });
      });
    } else {
      safeCapture('app_opened', { theme_mode: 'standard' });
    }

    render();
  </script>
</body>
</html>
